# Fleet CI caller — the workflow itself lives in vellum, pinned to a rev like
# every other vellum dependency; a bump PR moves this rev together with the
# Cargo and pyproject pins.
#
# The PASM ci-and-pages-release contract's required checks all survive the
# move: spec validation and the scenario replays, formatting, clippy, the
# test suite, the bounded generator corpus, the WASM build, and a Pages
# deploy only from a green default branch.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The deploy job inside fleet-ci needs pages + id-token; a called workflow can
# only narrow what the caller grants.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fleet:
    uses: jkeywo/vellum/.github/workflows/fleet-ci.yml@08b5fdb7608fa732de44885aac8c7af9791e2052
    with:
      pasm-scenario-glob: tests/replays/*.yaml
      # Every villain combination, bounded so a pathological seed cannot hang
      # the build.
      extra-check-commands: |
        cargo run --release -p rh-cli -- corpus --count 256 --budget-seconds 300
      # The browser client is deliberately not a Bevy app: hand-written JS
      # over a wasm-bindgen library, so the bindings land in the page shell's
      # own directory and `web/` is what ships.
      wasm-mode: wasm-pack
      wasm-pack-crate: crates/rh-web
      wasm-pack-out-dir: ../../web/pkg
      pages-dir: web
