# Development tooling for Rogue Hunter. Ships no Python of its own; exists to
# pull PASM. What stays here is pasm/spec — the model of *this* codebase — and
# pasm/tools/extract_strings.py, which is about this game's content pipeline
# rather than about architecture models.
[project]
name = "rogue-hunter-tooling"
version = "0.1.0"
description = "Development tooling for Rogue Hunter: the PASM architecture model."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # PASM lives in the fleet's shared repository (a subdirectory of vellum),
  # pinned to a rev: the scanner's findings are a gate, so which version
  # produced them matters. Bumping the rev is part of a vellum bump PR — see
  # vellum's docs/handbook/bump-workflow.md.
  "pasm @ git+https://github.com/jkeywo/vellum@65f65917adb8cad15a782bb1cde61d2448e3b731#subdirectory=pasm",
]

[tool.uv]
package = false

# Local override against a sibling vellum checkout — uncomment for local
# work, re-comment before committing. The committed state always resolves
# the pinned rev.
# [tool.uv.sources]
# pasm = { path = "../vellum/pasm", editable = true }
